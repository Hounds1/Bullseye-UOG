bullseye.uog.ccc.bind-host=127.0.0.1
bullseye.uog.ccc.port=7443
bullseye.uog.ccc.heartbeat-ms=5000
bullseye.uog.ccc.admission-timeout-ms=5000
bullseye.uog.ccc.max-connections=128
bullseye.uog.ccc.audit-file=var/ccc-audit.jsonl
# Defaults to the configured audit file's path with the .amc-offset suffix.
# bullseye.uog.ccc.audit-checkpoint=var/ccc-audit.jsonl.amc-offset

# Enable persistent CCC node registration. Omit for manual allowlist only.
bullseye.uog.ccc.registration-file=var/ccc-nodes.json
# Optional manual pins coexist with the registry. Required when registration-file is omitted.
# bullseye.uog.ccc.allow.edge-01=<64 hexadecimal characters>

# Optional enrollment HTTPS listener. See bullseye-ccc/ENROLLMENT-V1.md.
bullseye.uog.enrollment.enabled=false
# bullseye.uog.enrollment.bind-host=127.0.0.1
# bullseye.uog.enrollment.port=8443
# bullseye.uog.enrollment.public-origin=https://uog.example.org:8443
# bullseye.uog.enrollment.ccc-host=uog.example.org
# bullseye.uog.enrollment.server-ca-file=/etc/bullseye/tls/server-ca.pem
# bullseye.uog.enrollment.issuer-keystore=/etc/bullseye/tls/enrollment-issuer.p12
# bullseye.uog.enrollment.issuer-alias=enrollment-ca
# bullseye.uog.enrollment.issuer-password-file=/etc/bullseye/tls/enrollment-issuer.password
# bullseye.uog.enrollment.admin-token-file=/etc/bullseye/tls/enrollment-admin.token

bullseye.uog.tcc.enabled=true
bullseye.uog.tcc.latest-directory=var/tcc/latest

bullseye.uog.amc.enabled=true
bullseye.uog.amc.ccc-audit-directory=var/amc/ccc-audit
bullseye.uog.amc.tcc-telemetry-directory=var/amc/tcc-telemetry

bullseye.uog.amc.capacity.enabled=true
bullseye.uog.amc.capacity.interval-seconds=60
bullseye.uog.amc.capacity.min-free-bytes=1073741824
