plugins {
    id 'application'
}

dependencies {
    implementation project(':bullseye-ccc')
    implementation project(':bullseye-tcc')
}

application {
    mainClass = 'io.bullseye.uog.UogApplication'
    applicationName = 'bullseye-uog'
}

distributions {
    main {
        distributionBaseName = 'bullseye-uog'
        contents {
            from(rootProject.file('LICENSE'))
            from(rootProject.file('config/bullseye-uog.properties')) {
                into 'config'
            }
        }
    }
}
